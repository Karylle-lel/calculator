<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@latest/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@latest/css/ionic.bundle.css">


</head>

<body>

    <ion-app>

        <ion-header>
            <ion-toolbar>
                <ion-title>Simple Calculator</ion-title>
            </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">

            <ion-item>
                <ion-input
                    id="firstNumber"
                    label="First Number"
                    type="number">
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    id="secondNumber"
                    label="Second Number"
                    type="number">
                </ion-input>
            </ion-item>

            <div class="buttons">

                <ion-button size="small" onclick="addNumbers()">
                    ADD
                </ion-button>

                <ion-button size="small" onclick="subtractNumbers()">
                    SUBTRACT
                </ion-button>

                <ion-button size="small" onclick="multiplyNumbers()">
                    MULTIPLY
                </ion-button>

                <ion-button size="small" onclick="divideNumbers()">
                    DIVIDE
                </ion-button>

            </div>

            <div class="result">
                Result: <span id="result">0</span>
            </div>

        </ion-content>

    </ion-app>


    <script>

        function addNumbers() {
            let first = parseFloat(document.getElementById("firstNumber").value);
            let second = parseFloat(document.getElementById("secondNumber").value);

            let result = first + second;

            document.getElementById("result").textContent = result;
        }


        function subtractNumbers() {
            let first = parseFloat(document.getElementById("firstNumber").value);
            let second = parseFloat(document.getElementById("secondNumber").value);

            let result = first - second;

            document.getElementById("result").textContent = result;
        }


        function multiplyNumbers() {
            let first = parseFloat(document.getElementById("firstNumber").value);
            let second = parseFloat(document.getElementById("secondNumber").value);

            let result = first * second;

            document.getElementById("result").textContent = result;
        }


        function divideNumbers() {
            let first = parseFloat(document.getElementById("firstNumber").value);
            let second = parseFloat(document.getElementById("secondNumber").value);

            let result = first / second;

            document.getElementById("result").textContent = result;
        }

    </script>

</body>
</html>
